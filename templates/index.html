<!DOCTYPE html>
<html>

<head>
    <title>PDF READER</title>
    <style>
        /* body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px; */
        /* } */
        body{
            background-color: #b2b3b0;
        }
        .navbar {
            display:flex;
            justify-content: space-between;
            align-items: center;
            /* background-color: #ffacac; */
            margin-bottom: 20px;
            width:100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
        }

        .navbar h2{
            padding-left: 20px;
            text-decoration: underline;
        }
        .navbar ul{
            display: flex;
            padding-right: 50px;
            gap: 40px;
            list-style: none;
        }
        .navbar a:hover {
            color: #00d4ff;
        }

        .navbar li{
            cursor: pointer;
            font-size: large;
            margin-left: 20px;
            text-decoration: none;
            position: relative;
            transition: 0.3s;
        }

        .input{
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px; 
        }

        #chat-box {
            border: 1px solid #df6603; 
            height: 350px;
            overflow-y: auto;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            transition: 0.3s;
        }

        #chat-box:hover {
            box-shadow: 0 0 30px #df6603;
        }

        .pdf-file{
            cursor: pointer;
        }

        .user-msg {
            text-align: right;
            color: #0057b7;
            margin: 8px 0;
            padding: 10px;
            border-radius: 8px;
            animation: fadeIn 0.4s ease;
            background: #d1e7ff;
            text-align: right;
        }

        .bot-msg {
            text-align: left;
            color: #333;
            margin: 8px 0;
            padding: 10px;
            border-radius: 8px;
            animation: fadeIn 0.4s ease;
            background: #d1e7ff;
            text-align: left;
        }

        input[type="text"] {
            width: 78%;
            padding: 10px;
            border-radius: 6px;
            background: beige;
            border: 1px solid #502eac;
            box-shadow: 0 0 5px #502eac;
        }

        input[type="file"] {
            cursor: pointer;
        }

        /* optional styling */
        input[type="file"]::-webkit-file-upload-button {
            background: #7006678a;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        input[type="file"]::-webkit-file-upload-button:hover {
            background: #1e90ff;
        }

        button {
            padding: 10px 16px;
            background: #0057b7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: rgb(223, 0, 30);
            color: white;
            transition: 1s;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <h2 id="heading">PDF READER :- </h2>
        <ul>
            <li id="home"><a href="/">Home</a></li>
            <li id="home"><a href="/about">About</a></li>
        </ul>
    </nav>
    <div class="input">
    <input type="file" id="pdf-file" accept=".pdf" >
    <button onclick="uploadPDF()">Upload PDF</button>
    <p id="upload-status"></p>
    <div id="chat-box"> <h4>Hello, Welcome to PDF READER!! </h4></div>

    <input type="text" id="question" placeholder="Ask questions about that PDF......">
    <button onclick="askQuestion()" >Send</button>
    <p id="ans-status"></p>
    <script>
        async function uploadPDF() {
            const file = document.getElementById('pdf-file').files[0];
            if (!file) return alert('Select a PDF first!');
            const formData = new FormData();
            formData.append('pdf', file);
            document.getElementById('upload-status').innerText = 'Processing...';
            const res = await fetch('/upload', { method: 'POST', body: formData });
            const data = await res.json();
            document.getElementById('upload-status').innerText = data.message || data.error;
        }

        async function askQuestion() {
            const q = document.getElementById('question').value.trim();
            if (!q) return;
            addMessage(q, 'user-msg');
            document.getElementById('question').value = '';
            try {
                const res = await fetch('/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: q })
                });
                const text = await res.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch (parseError) {
                    throw new Error('Invalid JSON response:\n' + text);
                }
                if (!res.ok) {
                    throw new Error(data.error || text);
                }
                addMessage(data.answer || data.error || 'No response received.', 'bot-msg');
            } catch (err) {
                addMessage('Request failed: ' + err.message, 'bot-msg');
            }
        }

        function addMessage(text, cls) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = cls;
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }
        const input = document.getElementById("question");
        input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault(); // form reload stop
                askQuestion();
            }
        });
    </script>
    </div>
</body>

</html>
